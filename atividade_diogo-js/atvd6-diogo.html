<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pelepsia</title>
    <style>
        .butao{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        button{
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
        }

    </style>
</head>
<body>
        <div class="butao">
            <button onclick="document.body.style.backgroundColor='white'">branco</button>
            <button onclick="document.body.style.backgroundColor='black'">preto</button>
        </div>
</body>
</html>
