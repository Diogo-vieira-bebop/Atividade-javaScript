<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Diogo</title>
</head>
<body>  
    <script>
    let ano = prompt("Qual ano voce Nasceu?");
    if (ano >= 2025)
        alert("Você não nasceu ainda!");
    else {
        let idade = 2025 - ano;
        alert("Você tem " + idade + " anos de idade.");
    }

    </script>
</body>
</html>
