<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página</title>
    <style>
        button{
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            height: auto;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <button onclick="feliz()">Ficar feliz</button>
    <button onclick="triste()">Ficar triste</button>
    <script>
        function feliz() {
            document.body.style.backgroundColor = "yellow";
        }
        function triste() {
            document.body.style.backgroundColor = "black";
            
        }
    </script>
</body>
</html>
