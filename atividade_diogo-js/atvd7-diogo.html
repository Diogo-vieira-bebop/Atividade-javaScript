<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página</title>
    <style>
        p{
            display: flex;
            text-align: center;
            justify-content: center;
            max-height: none;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        button{
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
   <button id="mostrar">Mostrar texto</button>
   <p id="texto" style="display:none;">Harry Potter é muito bom!</p>

    <script>
         document.getElementById("mostrar").onclick = function(){
             var texto = document.getElementById("texto");
             if(texto.style.display === "none")
             {
                 texto.style.display = "block";
         } else {
             texto.style.display = "none";
         }
        }
    </script>
</body>
</html>
